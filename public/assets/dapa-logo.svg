<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 520" role="img" aria-label="DAPA Fashion and Watches Concept Logo">
  <defs>
    <pattern id="dapaDots" width="10" height="10" patternUnits="userSpaceOnUse">
      <circle cx="5" cy="5" r="1.2" fill="#111318" opacity="0.11" />
    </pattern>
  </defs>

  <!-- Editorial Paper Substrate -->
  <rect width="520" height="520" fill="#F5F2EB" />
  <rect width="520" height="520" fill="url(#dapaDots)" />

  <!-- Outer Comic Ink Frame -->
  <rect x="18" y="18" width="484" height="484" fill="none" stroke="#111318" stroke-width="4" />

  <!-- Subtle CMYK Offset Watch Bezel Rings -->
  <circle cx="255" cy="216" r="126" fill="none" stroke="#E81C2E" stroke-width="2.5" opacity="0.65" />
  <circle cx="265" cy="212" r="126" fill="none" stroke="#08B6E8" stroke-width="2.5" opacity="0.65" />

  <!-- Primary Swiss Watch Bezel Circle -->
  <circle cx="260" cy="214" r="126" fill="#FCFBF7" stroke="#111318" stroke-width="6" />
  <circle cx="260" cy="214" r="110" fill="none" stroke="#111318" stroke-width="1.6" stroke-dasharray="3 7" />

  <!-- 12, 3, 6, 9 Horology Hour Baton Markers -->
  <rect x="256" y="96" width="8" height="22" fill="#111318" />
  <rect x="256" y="310" width="8" height="22" fill="#111318" />
  <rect x="142" y="210" width="22" height="8" fill="#111318" />
  <rect x="356" y="210" width="22" height="8" fill="#111318" />

  <!-- Stylized Luxury Eye / Horology Crest inside the Dial -->
  <path
    d="M 176 214 Q 260 144 344 214 Q 260 284 176 214 Z"
    fill="#111318"
    stroke="#111318"
    stroke-width="4"
    stroke-linejoin="round"
  />
  <!-- Cyan & White Precision Iris -->
  <circle cx="260" cy="214" r="34" fill="#FCFBF7" stroke="#08B6E8" stroke-width="4" />
  <circle cx="260" cy="214" r="18" fill="#111318" />
  <!-- Crimson Spark Pupil -->
  <circle cx="260" cy="214" r="7" fill="#E81C2E" />
  <circle cx="266" cy="208" r="2.5" fill="#FCFBF7" />

  <!-- Bold Luxury Wordmark: D A P A -->
  <text
    x="260"
    y="416"
    text-anchor="middle"
    font-family="'Space Grotesk', 'Segoe UI', system-ui, sans-serif"
    font-size="68"
    font-weight="700"
    letter-spacing="18"
    fill="#111318"
  >DAPA</text>

  <!-- Sub-Caption -->
  <text
    x="260"
    y="452"
    text-anchor="middle"
    font-family="'JetBrains Mono', monospace"
    font-size="13"
    font-weight="700"
    letter-spacing="5"
    fill="#4B505D"
  >WATCHES · FASHION · RAH HOLDINGS</text>

  <!-- Diagonal Concept Placeholder Watermark -->
  <g transform="rotate(-24 260 260)" opacity="0.28">
    <rect x="-10" y="226" width="540" height="68" fill="#111318" />
    <text
      x="260"
      y="271"
      text-anchor="middle"
      font-family="'JetBrains Mono', monospace"
      font-size="30"
      font-weight="700"
      letter-spacing="12"
      fill="#FCFBF7"
    >PLACEHOLDER</text>
  </g>
</svg>
